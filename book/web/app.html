<!doctype html>
<html lang="ru">
<head>

<link rel="stylesheet" href="css/book.css">
</head>
<body>

<!-- ═══ Панель читалки (режим книги / печать) ═══ -->
<div class="reader-ui" role="toolbar" aria-label="Управление книгой">
    <button class="btn" id="rdMode" type="button">📖 Режим книги</button>
    <div class="title">Марьям в Мире Кода</div>
    <div class="pager">
        <button class="btn ico" id="rdPrev" type="button" aria-label="Предыдущая страница" title="Назад (←)">‹</button>
        <span class="ind" id="rdInd" aria-live="polite">1 / 1</span>
        <button class="btn ico" id="rdNext" type="button" aria-label="Следующая страница" title="Вперёд (→)">›</button>
        <button class="btn ico" id="rdPrint" type="button" aria-label="Печать или PDF" title="Печать / сохранить PDF">
            🖨
        </button>
    </div>
</div>

<!-- ═══ ЗАСТАВКА: комната зимним вечером, камин, книга на полке ═══ -->
<noscript><style>#intro{display:none!important}</style></noscript>
<div id="intro" aria-label="Заставка: нажми на книгу, чтобы открыть">
    <div class="fire-glow"></div>

    <div class="window">
        <div class="moon"></div>
        <div class="snow" id="snow"></div>
        <span class="bar-v"></span><span class="bar-h"></span>
    </div>

    <div class="fireplace">
        <div class="mantel"></div>
        <div class="stone">
            <div class="opening">
                <div class="flames"><i></i><i></i><i></i></div>
                <div class="logs"></div>
            </div>
        </div>
    </div>

    <!-- котик у камина, греется и смотрит на огонь -->
    <div class="cat" aria-hidden="true">
        <svg viewBox="0 0 120 150">
            <g class="tail">
                <path d="M30 132 C2 130 -2 104 16 96 C6 106 20 116 40 112 C46 118 44 132 30 132 Z"/>
            </g>
            <path d="M60 146 C34 146 28 126 33 108 C21 102 17 66 30 46 L25 16 L46 40
                     C52 36 68 36 74 40 L95 16 L90 46 C103 66 99 104 87 108
                     C92 126 86 146 60 146 Z"/>
            <ellipse class="eye" cx="50" cy="62" rx="3.4" ry="4.6"/>
            <ellipse class="eye" cx="70" cy="62" rx="3.4" ry="4.6"/>
        </svg>
    </div>

    <div class="bookshelf">
        <div class="brow" id="shelfTop">
            <span class="spine" style="height:78%;background:linear-gradient(#b5533f,#8f3d2e)"></span>
            <span class="spine" style="height:92%;background:linear-gradient(#3f7fae,#2f5f86)"></span>
            <span class="spine" style="height:70%;background:linear-gradient(#5aa06a,#3e7a4e)"></span>
            <button class="ourbook" id="ourbook" type="button" aria-label="Открыть книгу «Марьям в Мире Кода»">
                <span class="b-inside"></span>
                <span class="b-thick"></span>
                <span class="b-cover">
                    <span class="bc-eyebrow">КОД-РПГ · 200 ДНЕЙ</span>
                    <span class="bc-title">Марьям<br>в Мире Кода</span>
                    <span class="bc-cat">🐱</span>
                    <span class="bc-tetro">
                        <i style="background:var(--tI)"></i><i style="background:var(--tO)"></i>
                        <i style="background:var(--tT)"></i><i style="background:var(--tZ)"></i>
                    </span>
                </span>
            </button>
            <span class="spine" style="height:86%;background:linear-gradient(#c8923a,#a06e26)"></span>
            <span class="spine" style="height:74%;background:linear-gradient(#8a6bd0,#6a4bb0)"></span>
        </div>
        <div class="brow">
            <span class="spine" style="height:88%;background:linear-gradient(#4f8f9e,#357180)"></span>
            <span class="spine" style="height:72%;background:linear-gradient(#c46a5a,#9c4c3e)"></span>
            <span class="spine" style="height:94%;background:linear-gradient(#6a9a55,#4c7a3a)"></span>
            <span class="spine" style="height:66%;background:linear-gradient(#b58a3a,#906a26)"></span>
            <span class="spine" style="height:84%;background:linear-gradient(#7a6bd0,#5a4bb0)"></span>
            <span class="spine" style="height:78%;background:linear-gradient(#b5533f,#8f3d2e)"></span>
            <span class="spine" style="height:90%;background:linear-gradient(#3f7fae,#2f5f86)"></span>
        </div>
    </div>

    <div class="floor"><div class="rug"></div></div>

    <div class="title-room">Зимний вечер · время для сказки</div>
    <div class="hint">На полке стоит наша книга —<br><b>нажми на неё</b>, и она раскроется ✨</div>
    <button class="skip" id="introSkip" type="button">пропустить →</button>
</div>

<div class="book-clip">
<div class="wrap">
    <!-- Контент собирается из content/book.json + content/spreads/*.json скриптом render.js -->
</div><!-- /.wrap -->
    <!-- переплёт по центру разворота (со стежками) -->
    <div class="binding" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <!-- загнутый уголок страницы -->
    <div class="curl" aria-hidden="true"></div>
    <!-- переворачивающийся лист (анимация) -->
    <div class="leaf" id="leaf" aria-hidden="true"></div>
    <!-- фолио: номера страниц -->
    <span class="folio l" id="folioL" aria-hidden="true"></span>
    <span class="folio r" id="folioR" aria-hidden="true"></span>
</div><!-- /.book-clip -->

<!-- ═══════════════════════════════════════════════════════════════
     Читалка: постраничное перелистывание (режим книги).
     Контент раскладывается в вертикальные CSS-колонки фиксированной
     высоты; каждая колонка = страница. Листаем, сдвигая .wrap через
     CSS-переменную --pg (одна страница = ширина колонки + межстраничный
     зазор). Ссылки-якоря (оглавление, day-nav) перехватываются и
     переводят на нужную страницу. Печать использует @media print (поток).
     ═══════════════════════════════════════════════════════════════ -->

<!-- ═══════════════════════════════════════════════════════════════
     Оркестратор заставки: снег, полёт книги с полки и раскрытие.
     Клик по книге → measure центра → летит в центр экрана (scale) →
     обложка распахивается и книга вырастает на весь экран → показываем
     читалку. Esc / «пропустить» / no-JS — сразу к чтению.
     ═══════════════════════════════════════════════════════════════ -->

<script defer src="js/reader.js"></script>
<script defer src="js/render.js"></script>
<script defer src="js/intro.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
